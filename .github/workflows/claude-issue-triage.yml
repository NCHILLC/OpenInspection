name: Claude Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code for Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*" # issues may be filed by users without repo write access
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Read the issue and the repository's existing labels. Triage it:
            - Add appropriate type/priority/area labels with `gh issue edit`.
            - If it looks like a duplicate of an existing issue, comment linking to it.
            - If key information is missing (repro steps, version, logs), leave a
              comment asking for it.
            Do not close the issue.
          claude_args: |
            --allowedTools "Bash(gh issue edit:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh label list:*)"
