name: ISN type validation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/isn-template-mapping-101
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci
      - name: Enable normal commit and push checks
        run: |
          chmod +x .githooks/*
          git config core.fileMode false
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
      - name: Fix the mapping response helper's actual JSON contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/routes/resources/isn-mappings.tsx')
          text = p.read_text()
          old = 'async function errorMessage(res: Response)'
          new = 'async function errorMessage(res: { json: () => Promise<unknown> })'
          assert old in text
          p.write_text(text.replace(old, new))
          PY
      - run: npm run gen-version
      - run: npm run type-check
      - name: Commit and publish the verified mapping fix with hooks enabled
        run: |
          git add app/routes/resources/isn-mappings.tsx
          CI= git commit -m 'fix(isn): accept the typed JSON response contract in mapping actions' -m 'Chrome: /settings/advanced — mapping selection and saved confirmation already verified against the local ISN simulator; this change only narrows the helper type.' -m 'Co-Authored-By: OpenAI Codex <noreply@openai.com>'
          CI= git push origin HEAD:feat/isn-template-mapping-101
      - name: Incorporate the mapping fix into the application branch
        run: |
          git fetch origin feat/isn-apply-template-102 feat/isn-template-mapping-101
          git checkout -B feat/isn-apply-template-102 origin/feat/isn-apply-template-102
          CI= git merge --no-edit origin/feat/isn-template-mapping-101
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/isn-mapping-flow.spec.ts')
          text = p.read_text()
          old = "    const reset = await page.request.post('http://127.0.0.1:8792/__test/reset');"
          assert old in text
          text = text.replace(old, "    test.setTimeout(60_000);\n" + old)
          old = '    await page.goto(`/inspections/${inspection.id}/edit`);'
          assert old in text
          text = text.replace(old, "    const editorConnected = page.waitForEvent('websocket', { predicate: (socket) => socket.url().includes(`/inspections/${inspection.id}/collab/ws`) })\n        .then((socket) => socket.waitForEvent('framereceived'));\n" + old + '\n    await editorConnected;')
          p.write_text(text)
          PY
      - run: npm run gen-version
      - run: npm run type-check
      - name: Commit and publish the verified browser wait with hooks enabled
        run: |
          git add tests/e2e/isn-mapping-flow.spec.ts
          CI= git commit -m 'test(isn): wait for collaboration before checking opened-report refusal' -m 'Chrome: /settings/advanced — save mapping and import verified; /inspections/:id — refresh retains the original template, explicit apply changes it, and an opened report refuses replacement at desktop and phone widths.' -m 'Co-Authored-By: OpenAI Codex <noreply@openai.com>'
          CI= git push origin HEAD:feat/isn-apply-template-102
